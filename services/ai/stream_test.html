<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Streaming Test</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 700px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input, button { 
            padding: 10px; 
            font-size: 16px; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #output { 
            white-space: pre-wrap; 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px;
            min-height: 150px;
            border: 1px solid #e9ecef;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>Test AI Streaming (Web JS)</h2>
    
    <div class="controls">
        <label><b>API URL:</b></label>
        <input type="text" id="apiUrl" value="http://localhost:11434/v1/chat/completions" placeholder="Ví dụ: http://localhost:11434/v1/chat/completions">
        
        <label><b>Tên Model:</b></label>
        <input type="text" id="modelName" value="llama3.1" placeholder="Tên model đang chạy">
        
        <label><b>Câu hỏi (Prompt):</b></label>
        <input type="text" id="prompt" value="Viết một bài thơ ngắn 4 câu về lập trình web." placeholder="Nhập câu hỏi...">
        
        <button id="sendBtn" onclick="startStream()">Gửi Stream</button>
    </div>

    <div id="output">Kết quả sẽ hiện ra ở đây...</div>

    <script>
        async function startStream() {
            const outputDiv = document.getElementById('output');
            const sendBtn = document.getElementById('sendBtn');
            const apiUrl = document.getElementById('apiUrl').value;
            const prompt = document.getElementById('prompt').value;
            const modelName = document.getElementById('modelName').value;
            
            outputDiv.innerHTML = '<i>Đang kết nối...</i>';
            sendBtn.disabled = true;

            const payload = {
                model: modelName,
                messages: [{ role: "user", content: prompt }],
                stream: true // Bắt buộc phải có để báo server trả về dạng stream
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Nếu gọi API OpenAI hoặc dịch vụ có key, bỏ comment dòng dưới:
                        // 'Authorization': 'Bearer YOUR_API_KEY'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Lỗi HTTP! Trạng thái: ${response.status}`);
                }

                outputDiv.innerHTML = ''; 
                
                // Bắt đầu đọc dữ liệu stream trả về
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    // Giải mã bytes thành chuỗi
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        // Tìm các dòng bắt đầu bằng "data: "
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            
                            if (dataStr === '[DONE]') break; // Tín hiệu kết thúc của OpenAI format
                            
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.choices && data.choices.length > 0) {
                                    // Lấy từng chữ một
                                    const content = data.choices[0].delta.content || '';
                                    // In thẳng ra giao diện không chờ đợi
                                    outputDiv.appendChild(document.createTextNode(content));
                                }
                            } catch (e) {
                                // Lỗi parse có thể xảy ra nếu chunk bị cắt ngang, bỏ qua
                            }
                        }
                    }
                }
            } catch (error) {
                outputDiv.innerHTML += `<br><span style="color:red">Lỗi: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
